content:
  - name: sonderzeiten
    label: "Sonderöffnungszeiten"
    type: file
    path: "sonderzeiten.json"
    format: json
    list: true
    fields:
      - name: von
        label: "Datum"
        description: "Bei mehreren Tagen: erster Tag"
        type: date
        required: true
      - name: bis
        label: "Bis (optional)"
        description: "Nur ausfüllen, wenn der Termin mehrere Tage dauert, z. B. Weihnachtspause"
        type: date
      - name: status
        label: "Status"
        type: select
        required: true
        options:
          values:
            - Geschlossen
            - Sonderöffnung
            - Veranstaltung
      - name: uhrzeit_von
        label: "Uhrzeit von (optional)"
        description: "Format HH:MM, z. B. 10:00. Leer lassen für die regulären Zeiten"
        type: string
        pattern:
          regex: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Bitte im Format HH:MM eingeben, z. B. 10:00"
      - name: uhrzeit_bis
        label: "Uhrzeit bis (optional)"
        description: "Format HH:MM, z. B. 15:00"
        type: string
        pattern:
          regex: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Bitte im Format HH:MM eingeben, z. B. 15:00"
      - name: hinweis
        label: "Hinweis (optional)"
        description: "Wird auf der Website angezeigt, z. B. Hofflohmarkt"
        type: string
